services:
  - type: web
    name: access-request-operator-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn portal.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONIOENCODING
        value: utf-8
    healthCheckPath: /
