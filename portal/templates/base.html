<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Access Portal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f2f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --nav-bg: #0f172a;
      --nav-hover: #1e293b;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #d1fae5;
      --success-dark: #065f46;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --warning-dark: #92400e;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --danger-dark: #991b1b;
      --text: #1e293b;
      --text-2: #475569;
      --text-3: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
      --radius: 10px;
      --radius-sm: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Navigation ── */
    nav {
      background: var(--nav-bg);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 6px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 1px 8px rgba(0,0,0,.2);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: #f1f5f9;
      margin-right: 24px;
      text-decoration: none;
    }
    .nav-brand .logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    nav a:not(.nav-brand) {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: all .15s;
    }
    nav a:not(.nav-brand):hover { color: #f1f5f9; background: var(--nav-hover); }
    nav a.active { color: #f1f5f9; background: rgba(99,102,241,.3); }

    /* ── Layout ── */
    .container { max-width: 1040px; margin: 32px auto; padding: 0 28px; }

    /* ── Page header ── */
    .page-header { margin-bottom: 24px; }
    .page-header h1 {
      font-size: 22px; font-weight: 700;
      color: var(--text); letter-spacing: -.3px;
    }
    .page-header p { color: var(--text-2); margin-top: 4px; font-size: 13px; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h2 {
      font-size: 14px; font-weight: 600; color: var(--text);
    }
    .card-body { padding: 20px; }

    /* ── Stats grid ── */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .stat-card .stat-label { font-size: 12px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -1px; }
    .stat-card .stat-sub { font-size: 12px; color: var(--text-3); }
    .stat-card.warning .stat-value { color: var(--warning); }
    .stat-card.success .stat-value { color: var(--success); }
    .stat-card.danger  .stat-value { color: var(--danger); }
    .stat-card.primary .stat-value { color: var(--primary); }

    /* ── Quick actions ── */
    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .action-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-decoration: none;
      display: flex; flex-direction: column; gap: 10px;
      transition: all .15s;
      cursor: pointer;
    }
    .action-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: var(--primary); }
    .action-card .icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .action-card .icon.indigo { background: var(--primary-light); }
    .action-card .icon.green  { background: var(--success-light); }
    .action-card .icon.amber  { background: var(--warning-light); }
    .action-card .title { font-size: 14px; font-weight: 600; color: var(--text); }
    .action-card .desc  { font-size: 12px; color: var(--text-2); }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
    }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
    .badge-provisioned { background: var(--success-light); color: var(--success-dark); }
    .badge-provisioned::before { background: var(--success); }
    .badge-pending { background: var(--warning-light); color: var(--warning-dark); }
    .badge-pending::before { background: var(--warning); }
    .badge-rejected { background: var(--danger-light); color: var(--danger-dark); }
    .badge-rejected::before { background: var(--danger); }
    .badge-confidential { background: #fdf4ff; color: #7e22ce; }
    .badge-confidential::before { background: #a855f7; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surface-2); }
    th {
      text-align: left; padding: 10px 16px;
      font-size: 11px; font-weight: 600; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: var(--surface-2); }
    .cell-id { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--primary); }
    .cell-muted { color: var(--text-3); font-size: 12px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; cursor: pointer; border: none;
      text-decoration: none; transition: all .15s; white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-danger:hover  { background: #dc2626; }
    .btn-ghost { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-xs { padding: 3px 8px; font-size: 11px; }

    /* ── Forms ── */
    .form-group { margin-bottom: 18px; }
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-2); margin-bottom: 6px; letter-spacing: .2px;
    }
    input[type=text], input[type=email], textarea, select {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-family: inherit;
      background: var(--surface); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    input[type=text]:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    .form-hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ── Alert ── */
    .alert {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 16px; border-radius: var(--radius-sm);
      font-size: 13px; margin-bottom: 18px;
    }
    .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .alert-error { background: var(--danger-light); color: var(--danger-dark); border: 1px solid #fca5a5; }
    .alert-info  { background: var(--primary-light); color: #3730a3; border: 1px solid #c7d2fe; }
    .alert-warning { background: var(--warning-light); color: var(--warning-dark); border: 1px solid #fde68a; }

    /* ── Search bar ── */
    .search-bar {
      display: flex; gap: 10px; margin-bottom: 20px; align-items: center;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap input {
      padding-left: 38px;
      background: var(--surface);
    }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); pointer-events: none; font-size: 15px;
    }

    /* ── Timeline ── */
    .timeline { padding: 4px 0; }
    .timeline-item {
      display: flex; gap: 14px; padding-bottom: 20px; position: relative;
    }
    .timeline-item:not(:last-child)::before {
      content: '';
      position: absolute; left: 15px; top: 28px; bottom: 0;
      width: 2px; background: var(--border);
    }
    .timeline-dot {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; border: 2px solid var(--border);
      background: var(--surface);
    }
    .timeline-dot.created  { border-color: var(--primary); background: var(--primary-light); }
    .timeline-dot.approved { border-color: var(--success); background: var(--success-light); }
    .timeline-dot.rejected { border-color: var(--danger);  background: var(--danger-light); }
    .timeline-content { flex: 1; padding-top: 4px; }
    .timeline-title { font-weight: 600; font-size: 13px; }
    .timeline-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    /* ── Info grid ── */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .info-row {
      display: contents;
    }
    .info-label, .info-value {
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .info-label { font-weight: 500; color: var(--text-3); background: var(--surface-2); }
    .info-value { color: var(--text); }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 48px 24px; color: var(--text-3);
    }
    .empty .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty .empty-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }

    /* ── Approval form ── */
    .approval-section {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .approval-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .approval-card.approve-card { border-color: #6ee7b7; background: #f0fdf4; }
    .approval-card.reject-card  { border-color: #fca5a5; background: #fff5f5; }
    .approval-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
    .approval-card.approve-card h3 { color: var(--success-dark); }
    .approval-card.reject-card  h3 { color: var(--danger-dark); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .stats-grid  { grid-template-columns: 1fr 1fr; }
      .action-grid { grid-template-columns: 1fr; }
      .form-row    { grid-template-columns: 1fr; }
      .info-grid   { grid-template-columns: 1fr; }
      .approval-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">
    <div class="logo">🔐</div>
    Access Portal
  </a>
  <a href="/">Dashboard</a>
  <a href="/employees">Employees</a>
  <a href="/systems">Systems</a>
  <a href="/requests/new">New Request</a>
  <a href="/approvals">Approvals</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
